{% extends 'base.html' %}

{% block content %}
<style>
    div .input-group {
        width: 120px;
    }
</style>

<div class="container">
    <h2>Cart</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
            </tr>
        </thead>
        <tbody>
            {% for entry in cart %}
            <tr>
                <td>{{ entry.item.name }}</td>
                <td>
                    <div class="input-group input-group-sm">
                        <button class="btn btn-outline-primary btn-sm quantity-update"
                            data-item-id="{{ entry.item.id }}" data-action="remove">-</button>
                        <input type="number" min="1" class="form-control text-center quantity-input"
                            value="{{ entry.quantity }}" data-item-id="{{ entry.item.id }}">
                        <button class="btn btn-outline-primary btn-sm quantity-update"
                            data-item-id="{{ entry.item.id }}" data-action="add">+</button>
                    </div>
                </td>
                <td>${{ entry.item.price_per_unit }}</td>
                <td>${{ entry.total_price }}</td>
            </tr>
            {% endfor %}
            <tr>
                <td colspan="3"><strong>Total Cart Price</strong></td>
                <td><strong>${{ total_cart_price }}</strong></td>
                <td></td>
            </tr>
        </tbody>
    </table>

    <!-- Delivery or Pickup Form -->
    <form id="checkout-form" method="post" action="{% url 'create_checkout_session' %}">
        {% csrf_token %}
        <div class="form-group mt-3">
            <label>Delivery or Pickup</label><br>
            <input type="radio" name="delivery_or_pickup" value="Delivery" required> Delivery<br>
            <input type="radio" name="delivery_or_pickup" value="Pickup" required> Pickup
        </div>

        <div class="form-group mt-2" id="address-group" style="display: none;">
            <label for="delivery_address">Delivery Address</label>
            <input type="text" name="delivery_address" id="delivery_address" class="form-control"
                placeholder="Enter address for delivery">
        </div>

        <!-- Place Order Button -->
        <div class="text-center mt-3">
            <button type="submit" class="btn btn-primary">Proceed to Checkout</button>
        </div>
    </form>
</div>

<script>
    $(document).ready(function () {
        // Show delivery address field only if "Delivery" is selected
        $('input[name="delivery_or_pickup"]').change(function () {
            if ($(this).val() === 'Delivery') {
                $('#address-group').show();
            } else {
                $('#address-group').hide();
            }
        });

        $('.quantity-update').click(function () {
            var itemId = $(this).data('item-id');
            var action = $(this).data('action');
            $.ajax({
                url: '{% url "update_cart" %}',
                type: 'post',
                data: {
                    'item_id': itemId,
                    'action': action,
                    'csrfmiddlewaretoken': '{{ csrf_token }}'
                },
                success: function (response) {
                    if (response.success) {
                        location.reload();  // Reload the page to update the cart display
                    }
                }
            });
        });
    });
</script>
{% endblock %}
